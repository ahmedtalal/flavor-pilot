name: flavorpilot
description: A CLI tool that sets up and manages Flutter flavors in one place. Run, build, and release any flavor with a single short command.
version: 0.2.0
repository: https://github.com/ahmedtalal/flavor-pilot
issue_tracker: https://github.com/ahmedtalal/flavor-pilot/issues
topics:
  - flutter
  - flavors
  - cli
  - android
  - ios

environment:
  sdk: ^3.8.0

# Makes `flavorpilot` available as a terminal command after
# `dart pub global activate flavorpilot`.
executables:
  flavorpilot: flavorpilot

dependencies:
  args: ^2.7.0
  image: ^4.12.0
  path: ^1.9.0
  yaml: ^3.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
